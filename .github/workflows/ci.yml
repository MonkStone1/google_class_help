name: CI

on:
  push:
  pull_request:

jobs:
  text-encoding:
    # A UTF-16LE fragment appended to a tracked text file (PowerShell 5.1
    # `>>` / `Add-Content` default) leaves NUL bytes inside valid UTF-8. Such
    # a file still opens in an editor but GitHub renders it as plain text
    # instead of markdown, so the whole README looks like one solid block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_text_encoding.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest
