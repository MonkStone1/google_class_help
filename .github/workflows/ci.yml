name: CI

on:
  push:
  pull_request:

jobs:
  text-encoding:
    # A UTF-16LE fragment appended to a tracked text file (PowerShell 5.1
    # `>>` / `Add-Content` default) leaves NUL bytes inside valid UTF-8. Such
    # a file still opens in an editor but GitHub renders it as plain text
    # instead of markdown, so the whole README looks like one solid block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_text_encoding.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `npm run lint` is `eslint src && tsc --noEmit`; `npm run build` adds
      # the real `tsc -b` project graph plus the Vite bundle, so a broken
      # build reference or an import that only resolves under one entry point
      # fails here instead of on someone's machine (ADR-0040, stage 0).
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest

  pyright:
    # Stage 4 (ADR-0039 §8). Ruff cannot see that a re-export points at the wrong
    # module: the mistake that costs the most during the restructure was a
    # facade that looked fine and resolved to a different object. Pyright is
    # what catches "this name exists, in the wrong place".
    #
    # ``extraPaths`` is ``backend`` because that directory is the ``sys.path``
    # root at runtime: ``import core.config`` only works because of it, and a
    # checker that does not know that reports every layered import as missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      # Pyright ships as a Node package, and the frontend job already pins Node,
      # so the checker is invoked through npx rather than pip: two versions of
      # one tool in one repo is how the editor and CI disagree about a file.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pyright@1.1.414 --project pyrightconfig.json
