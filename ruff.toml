# Shared ruff configuration so CLI and editor runners sort imports identically.
# Without an explicit classification, isort resolves third-party packages
# (fastapi, sqlalchemy) inconsistently and keeps re-sorting the import block.
[lint]
# F811 catches redefinitions of unused names (e.g. a copy-pasted duplicate
# function that silently overwrites the original — review §1.1).
extend-select = ["F811"]

[lint.isort]
known-first-party = [
    "admin_auth",
    "admins_api",
    "api",
    "auth",
    "background_sync",
    "capacity",
    "classroom_api",
    "config",
    "database",
    "feedback_admin_api",
    "feedback_api",
    "feedback_attachments",
    "feedback_service",
    "grading",
    "hosted_auth",
    "loadtest_report",
    "loadtest_seed",
    "loadtest_watch",
    "main",
    "maintenance",
    "metrics",
    "models",
    "models_admin",
    "models_auth",
    "models_feedback",
    "ownership",
    "path_config",
    "proxy",
    "rate_limit",
    "schemas",
    "schemas_admins",
    "schemas_feedback",
    "sync",
    "sync_scheduler",
    "sync_service",
    "sync_store",
    "sync_worker",
    "token_crypto",
]
