# Alembic configuration (migration stage 3, §11).
#
# The database URL is NOT stored here: it always comes from the DATABASE_URL
# environment variable (see migrations/env.py). Versioned migrations are the
# only schema mechanism for PostgreSQL — fresh installations run
# `alembic upgrade head`, changes land as new reviewed revisions.
#
#   .venv/Scripts/python.exe -m alembic upgrade head      # apply
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "..."
#   .venv/Scripts/python.exe -m alembic history --verbose

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
# Local time in revision file names is fine; timestamps stay out of the DB.
prepend_sys_path =
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
