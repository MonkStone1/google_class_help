<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Dashboard</title>
    <!-- Favicons generated by tools/make_icon.py into frontend/public (Vite
         copies them verbatim into dist). The SVG is the modern pick; the .ico
         and PNGs stay as fallbacks for older browsers and iOS. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- External (not inline) so the hosted CSP can stay script-src 'self'
         without hashes (migration stage 8, §48). Synchronous on purpose:
         it must run before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
